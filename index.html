<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダンジョン・ナンパ・クロニクル</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0a0a1a;
  overflow: hidden;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(40,20,60,0.5) 0%, transparent 60%),
    linear-gradient(180deg, #0a0a1a 0%, #12122e 100%);
}
#game-wrapper {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  box-shadow:
    0 0 40px rgba(100, 40, 140, 0.25),
    0 0 80px rgba(60, 20, 100, 0.10),
    inset 0 0 1px rgba(255,255,255,0.1);
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 1px solid #333;
}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="800" height="640"></canvas>
</div>

<script src="js/data.js"></script>
<script src="js/entities.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/battle.js"></script>
<script src="js/ai.js"></script>
<script src="js/sprites.js"></script>
<script src="js/renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
