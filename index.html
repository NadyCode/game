<!DOCTYPE html>

<head>

<title>ダンジョン・ナンパ・クロニクル</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;

<div id="game-wrapper">
  <canvas id="game" width="800" height="640"></canvas>
</div>

</html>
